[package]
name = "davrlar-game"
version = "0.1.0"
edition = "2021"
description = "Клиент Davrlar на macroquad"

[[bin]]
name = "davrlar"
path = "src/main.rs"

[dependencies]
davrlar-core = { path = "../rust-core" }
macroquad = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dejavu = "2"
sys-locale = "0.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
